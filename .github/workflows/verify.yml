name: Verify

# NOTE: this file must live in .github/workflows/ — GitHub ignores workflows anywhere else
# (it used to sit in the repo root, so these checks never actually ran in CI).
#
# Runs the same checks documented in scripts/verify.js on every push and
# every pull request against main — syntax validation, dangling handlers,
# duplicate definitions, missing DOM references, and i18n key parity.
# This doesn't test actual runtime behavior; it catches the specific,
# easy-to-miss class of mistake that's broken this project before: an
# edit that silently drops a function declaration, an i18n key added in
# one language but not the other, a handler wired to something that no
# longer exists.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # The behavioural tests use the real firebase-admin (no network), so dependencies are needed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run verification checks
        run: npm run verify

      # Workspace isolation, receipts, invoice payment info, rent coverage.
      - name: Run tests
        run: npm test
