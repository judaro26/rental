name: Deploy Firestore Rules

# Runs only when firestore.rules (or its own Firebase config) actually
# changes — not on every push — since re-deploying identical rules on
# every unrelated commit would be pure noise. This is intentionally
# separate from verify.yml: that one checks code quality on every push;
# this one deploys a live security artifact, and only when it changes.
#
# This exists because committing firestore.rules to GitHub does NOT, by
# itself, make it the live rules Firebase enforces — Netlify's build
# process has no concept of Firestore rules at all, and until this
# workflow existed, getting a rules change from "committed" to "actually
# protecting the database" was a separate, easy-to-forget manual step
# (`firebase deploy --only firestore:rules`, run by hand from someone's
# own machine).

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firestore-rules.yml'

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # firebase-tools@15.22.1 requires Node >=20 — this workflow was
          # copying the Node 18 version the Netlify functions happen to run
          # on, which isn't actually relevant here (a separate CLI tool with
          # its own requirements, not code running in this app itself). 24
          # matches what GitHub's own runners are already forcing checkout/
          # setup-node onto in this same job, per the deprecation warning.
          node-version: '24'

      - name: Install Firebase CLI
        # Pinned, not latest — firebase-tools 15.22.2 (published 2026-06-24)
        # introduced a confirmed regression where GOOGLE_APPLICATION_CREDENTIALS
        # auth is silently rejected in CI with "Failed to authenticate, have
        # you run firebase login?" even with fully valid credentials (see
        # firebase/firebase-tools issue #10716 — 15.22.1 is the last version
        # confirmed unaffected). Several releases have shipped since without
        # an explicit fix note for this issue, so this pins to the known-good
        # version rather than assuming a later one resolved it. Worth
        # revisiting this pin if a confirmed fix shows up in a firebase-tools
        # changelog later.
        run: npm install -g firebase-tools@15.22.1

      - name: Write service account credentials to a temp file
        # Single-quoted so the shell treats the substituted JSON as a
        # single literal string — GitHub Actions expands ${{ secrets.X }}
        # before the shell ever sees this line, so this is safe as long as
        # the JSON itself contains no literal single-quote characters,
        # which a standard Firebase service account key never does (JSON
        # strings use double quotes). $RUNNER_TEMP is GitHub's own
        # per-job temp directory, wiped when the job ends.
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        # --project is passed explicitly rather than relying on
        # .firebaserc's "default" alias — that file has already been
        # uploaded once without its required leading dot (as `firebaserc`
        # instead of `.firebaserc`), which is invisible to the Firebase
        # CLI and produces exactly the "No currently active project"
        # error this flag sidesteps entirely. .firebaserc is still useful
        # for anyone running the deploy command by hand from their own
        # machine, but this workflow no longer depends on it existing or
        # being named correctly.
        run: firebase deploy --only firestore:rules --project rental-a0793

      - name: Clean up credentials file
        # Belt-and-suspenders — $RUNNER_TEMP is already wiped between jobs,
        # but there's no reason to leave a service account key sitting on
        # disk for the remainder of this job's run either.
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
